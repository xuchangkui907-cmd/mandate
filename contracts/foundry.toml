[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

# Tempo Mainnet chainId: 4217
# No native gas token — fees are paid in USD TIP-20 (pathUSD).
# TIP-20 transfers land on payment lanes with reserved blockspace.

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
